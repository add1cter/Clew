name: Release

on:
  push:
    tags: ['v1.*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          python -m pip install -e backend -r desktop/requirements.txt
      - name: Locate Python
        run: python -c "import sys; print('CLEW_PYTHON=' + sys.executable)" >> "$GITHUB_ENV"
      - name: Verify
        run: |
          npm run check:version
          npm run test:desktop
          npm --prefix frontend run test
          npm --prefix frontend run test:localization
          PYTHONPATH=backend python -m unittest discover -s backend/tests -v
          npm audit --audit-level=high
          npm --prefix frontend audit --audit-level=high
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package -- --win --${{ matrix.arch }} --publish never
      - name: Smoke Windows package
        run: npm run smoke:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clew-${{ runner.os }}-${{ matrix.arch }}
          path: |
            desktop/artifacts/*.exe
            desktop/artifacts/latest.yml
            desktop/artifacts/*.blockmap
            desktop/artifacts/smoke-win32-x64.json
            desktop/artifacts/smoke-win32-x64.png
          if-no-files-found: error

  prepare-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node desktop/scripts/collect-release.cjs downloaded-artifacts release-assets --windows
      - name: Verify release version and artifacts
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          cp LICENSE release-assets/LICENSE
          notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          test -s "$notes"
          cp "$notes" release-assets/RELEASE_NOTES.md
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Prepare draft for owner publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --title "Clew ${GITHUB_REF_NAME#v}" --notes-file release-assets/RELEASE_NOTES.md --draft
